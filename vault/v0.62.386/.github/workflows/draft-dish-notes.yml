name: Draft dish explanations (Gemini grounded)

# Manual-only. Drafts SOURCED English explanations for nation-overlay iconic
# dishes that have no note yet, via Gemini grounded with Google Search, then
# pushes the generated overlay to `bot/draft-dish-notes` for review. Does NOT
# create the PR itself (repo policy blocks Actions from creating PRs) — open it
# from the pushed branch with a human token. Batched + idempotent + bounded
# (DRAFT_MAX_BATCHES) so each run stays reviewable. GEMINI_API_KEY is injected
# into the runner env only — never committed/logged. English-only; translations
# are a separate step (translate-content workflow).
on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Dishes per Gemini call'
        required: false
        default: '6'
      max_batches:
        description: 'Max batches this run (keeps the review PR small)'
        required: false
        default: '8'

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Draft dish explanations
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRAFT_BATCH_SIZE: ${{ github.event.inputs.batch_size }}
          DRAFT_MAX_BATCHES: ${{ github.event.inputs.max_batches }}
        run: node scripts/draft-dish-notes.mjs
      - name: Push generated overlay to branch
        run: |
          set -e
          PATHS="nation-overlay-dishnotes.generated.js"
          if [ -z "$(git status --porcelain $PATHS)" ]; then
            echo "No change to the dish-notes overlay — nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B bot/draft-dish-notes
          git add $PATHS
          git commit -m "chore(content): drafted English dish explanations (grounded batch)"
          git push --force origin bot/draft-dish-notes
          echo "Pushed bot/draft-dish-notes — open a PR from this branch to review the English."
