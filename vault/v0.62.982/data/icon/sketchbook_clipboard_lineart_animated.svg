<svg viewBox="0 0 720 840" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated eating sketchbook: copy a venue, file it into a time-segment drawer, friends fork in one tap">
  <defs>
    <style>
      .ink   { fill:none; stroke:#1E3A63; stroke-width:3;   stroke-linecap:round; stroke-linejoin:round; }
      .ink2  { fill:none; stroke:#1E3A63; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; opacity:.55; }
      .hair  { fill:none; stroke:#1E3A63; stroke-width:2;   stroke-linecap:round; stroke-linejoin:round; opacity:.4; }
      .arc   { fill:none; stroke:#1E3A63; stroke-width:2.6; stroke-linecap:round; stroke-dasharray:1 11; opacity:.55; }
      .pull  { fill:none; stroke:#1E3A63; stroke-width:6;   stroke-linecap:round; opacity:.7; }
      .lbl   { fill:#1E3A63; font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight:600; }
      .lbl2  { fill:#1E3A63; font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight:500; opacity:.6; }
      .star  { fill:none; stroke:#1E3A63; stroke-width:2.4; stroke-linejoin:round; }

      .card  { animation: fly 4s cubic-bezier(.45,.05,.35,1) infinite; }
      @keyframes fly {
        0%,8%   { transform: translate(504px,216px) rotate(-9deg); opacity:1; }
        26%     { transform: translate(458px,324px) rotate(-9deg); opacity:1; }
        46%     { transform: translate(388px,400px) rotate(-9deg); opacity:1; }
        56%,76% { transform: translate(388px,404px) rotate(-9deg); opacity:0; }
        84%     { transform: translate(504px,216px) rotate(-9deg); opacity:1; }
        100%    { transform: translate(504px,216px) rotate(-9deg); opacity:1; }
      }
      .twinkle { animation: tw 1.1s ease-in-out infinite; transform-origin:41px -22px; }
      @keyframes tw { 0%,100%{transform:scale(1);} 50%{transform:scale(1.22);} }

      .lunch { animation: nudge 4s ease-in-out infinite; }
      @keyframes nudge { 0%,44%{transform:translateY(0);} 50%{transform:translateY(4px);} 58%,100%{transform:translateY(0);} }

      .pop { animation: pop 4s ease-out infinite; transform-origin:396px 742px; }
      @keyframes pop { 0%,54%{transform:scale(.001);opacity:0;} 64%{transform:scale(1.25);opacity:1;} 82%{transform:scale(1);opacity:.85;} 88%,100%{transform:scale(.001);opacity:0;} }
    </style>
  </defs>

  <!-- board + clip -->
  <rect class="ink" x="70" y="96" width="580" height="712" rx="30"/>
  <rect class="hair" x="84" y="110" width="552" height="684" rx="22"/>
  <rect class="ink" x="300" y="54" width="120" height="66" rx="16"/>
  <rect class="ink" x="336" y="40" width="48" height="22" rx="10"/>
  <line class="ink2" x1="324" y1="92" x2="396" y2="92"/>

  <!-- header doodle -->
  <line class="ink" x1="108" y1="194" x2="212" y2="194"/>
  <path class="ink" d="M118 194 Q160 240 202 194"/>
  <path class="ink2" d="M150 176 q9 -9 0 -18 q-9 -9 0 -18"/>
  <path class="ink2" d="M172 176 q9 -9 0 -18 q-9 -9 0 -18"/>
  <path class="ink2" d="M250 176 q24 -10 48 0 t48 0 t48 0"/>
  <path class="hair" d="M250 204 q24 -9 48 0 t48 0"/>

  <!-- Copy chip -->
  <rect class="ink" x="452" y="170" width="116" height="44" rx="22"/>
  <rect class="ink2" x="470" y="180" width="20" height="24" rx="4"/>
  <rect class="ink2" x="478" y="174" width="20" height="24" rx="4"/>
  <text class="lbl" x="506" y="198" font-size="20">Copy</text>

  <line class="hair" x1="100" y1="246" x2="620" y2="246"/>

  <!-- cabinet -->
  <rect class="ink2" x="120" y="266" width="480" height="466" rx="16"/>

  <g><rect class="ink" x="138" y="282" width="444" height="56" rx="10"/>
    <line class="ink2" x1="148" y1="320" x2="186" y2="320"/><path class="ink2" d="M153 320 a14 14 0 0 1 28 0"/>
    <text class="lbl" x="210" y="318" font-size="22">Breakfast</text><line class="pull" x1="522" y1="310" x2="560" y2="310"/></g>

  <g><rect class="ink" x="138" y="346" width="444" height="56" rx="10"/>
    <circle class="ink2" cx="167" cy="374" r="10"/>
    <line class="hair" x1="167" y1="356" x2="167" y2="350"/><line class="hair" x1="167" y1="392" x2="167" y2="398"/>
    <line class="hair" x1="149" y1="374" x2="143" y2="374"/><line class="hair" x1="185" y1="374" x2="191" y2="374"/>
    <text class="lbl" x="210" y="382" font-size="22">Brunch</text><line class="pull" x1="522" y1="374" x2="560" y2="374"/></g>

  <g class="lunch"><rect class="ink" x="162" y="410" width="444" height="56" rx="10"/>
    <path class="ink" d="M162 410 Q384 393 606 410"/><path class="hair" d="M178 410 Q384 401 590 410"/>
    <line class="ink2" x1="186" y1="442" x2="216" y2="442"/><path class="ink2" d="M189 442 Q201 462 213 442"/>
    <text class="lbl" x="238" y="446" font-size="22">Lunch</text><line class="pull" x1="548" y1="438" x2="586" y2="438"/></g>

  <g><rect class="ink" x="138" y="474" width="444" height="56" rx="10"/>
    <path class="ink2" d="M155 496 h22 v8 a11 11 0 0 1 -22 0 z"/><path class="ink2" d="M177 498 a7 7 0 0 1 0 12"/>
    <line class="hair" x1="153" y1="514" x2="179" y2="514"/>
    <text class="lbl" x="210" y="510" font-size="22">Tea Break</text><line class="pull" x1="522" y1="502" x2="560" y2="502"/></g>

  <g><rect class="ink" x="138" y="538" width="444" height="56" rx="10"/>
    <circle class="ink2" cx="167" cy="566" r="13"/><circle class="hair" cx="167" cy="566" r="7"/>
    <line class="hair" x1="150" y1="556" x2="150" y2="576"/><line class="hair" x1="184" y1="556" x2="184" y2="576"/>
    <text class="lbl" x="210" y="574" font-size="22">Dinner</text><line class="pull" x1="522" y1="566" x2="560" y2="566"/></g>

  <g><rect class="ink" x="138" y="602" width="444" height="56" rx="10"/>
    <path class="ink2" d="M177 620 a14 14 0 1 0 0 20 a11 11 0 0 1 0 -20 z"/>
    <text class="lbl" x="210" y="638" font-size="22">Supper</text><line class="pull" x1="522" y1="630" x2="560" y2="630"/></g>

  <g><rect class="hair" x="138" y="666" width="444" height="34" rx="14"/>
    <line class="ink2" x1="160" y1="683" x2="176" y2="683"/><line class="ink2" x1="168" y1="675" x2="168" y2="691"/>
    <text class="lbl2" x="190" y="690" font-size="18">Night Snack &#183; and more</text></g>

  <!-- flight arc -->
  <path class="arc" d="M504 216 C500 296 460 352 388 400"/>

  <!-- flying card -->
  <g class="card">
    <rect class="ink" x="-60" y="-42" width="120" height="84" rx="14"/>
    <line class="ink2" x1="-34" y1="-12" x2="2" y2="-12"/><path class="ink2" d="M-30 -12 Q-16 10 -2 -12"/>
    <line class="hair" x1="-34" y1="16" x2="34" y2="16"/><line class="hair" x1="-34" y1="28" x2="14" y2="28"/>
    <g class="twinkle"><path class="star" d="M41 -34 l5.2 10.5 11.6 1.7 -8.4 8.2 2 11.6 -10.4 -5.5 -10.4 5.5 2 -11.6 -8.4 -8.2 11.6 -1.7 z"/></g>
    <path class="ink" transform="translate(46 36)" d="M0 0 L0 26 L7 19 L12 30 L17 28 L12 17 L22 17 Z"/>
  </g>

  <!-- share / fork -->
  <circle class="ink" cx="166" cy="772" r="11"/>
  <circle class="ink" cx="232" cy="748" r="11"/>
  <circle class="ink" cx="232" cy="796" r="11"/>
  <line class="ink2" x1="176" y1="767" x2="222" y2="753"/><line class="ink2" x1="176" y1="777" x2="222" y2="791"/>
  <rect class="ink2" x="316" y="744" width="76" height="60" rx="9"/>
  <rect class="hair" x="344" y="738" width="20" height="11" rx="4"/>
  <line class="hair" x1="330" y1="766" x2="378" y2="766"/><line class="hair" x1="330" y1="778" x2="366" y2="778"/>
  <path class="ink2" d="M243 766 q40 -14 70 -16"/>
  <g class="pop"><circle class="ink2" cx="396" cy="742" r="13"/>
    <line class="ink2" x1="396" y1="736" x2="396" y2="748"/><line class="ink2" x1="390" y1="742" x2="402" y2="742"/></g>
  <text class="lbl2" x="418" y="780" font-size="18">1-tap fork</text>
</svg>
