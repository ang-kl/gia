# Example config — points vibe-journal at the surrounding gia repo.
# Paths are RELATIVE to this config file (`.vibe-journal/examples/soleat-gia/config.yaml`)
# so the framework works on any clone of gia without path edits.
project:
  name: Soleat (gia)
  repo: ang-kl/gia
  doc_root: ../../../doc/
  vault_root: ../../../vault/
  repo_root: ../../../

output: ../../../dist/vibe-journal/

sources:
  pr:
    enabled: true
    github_repo: ang-kl/gia
  register:    { glob: ../../../doc/Register/register-*.md }
  third_party:
    sources:
      - { type: yaml, path: ../../../doc/third-party.yaml }
      - { type: github-issues, repo: ang-kl/gia, state: all }
  technical:   { glob: ../../../doc/Technical/technical-*.md }
  feature:     { glob: ../../../doc/Feature/feature-*.md }
  legal:       { glob: ../../../doc/Legal/legal-*.md }
  vault:       { glob: ../../../vault/*/VAULT_README.md }
  journal:     { glob: ../../../doc/Journal/journal-*.md, hdr_format: "[HDR]" }
  builder:     { glob: ../../../doc/Builder/builder-*.md }
  persona:     { glob: ../../../doc/Persona/persona-*.md }
