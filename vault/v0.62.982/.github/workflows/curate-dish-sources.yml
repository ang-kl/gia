name: Curate dish sources (Gemini grounded, tourism-board first)

# Manual-only. Re-curates the `source` field for entries in
# nation-overlay-dishnotes.generated.js whose current source is broken
# (expiring vertexaisearch grounding-redirect), weak (bare label, no URL),
# banned (Grokipedia, social, blog), or on an unknown host. New source URLs
# are sought via Gemini grounded with Google Search, prompted to prefer
# official tourism boards first, then authorised food-media, then Wikipedia
# only if a concrete article URL is found. The dish EXPLANATION (note.en)
# is preserved verbatim — only `source` is rewritten — so it is safe to run
# after the English copy has been reviewed. Result is pushed to
# `bot/curate-dish-sources` for the operator to open a PR from. Batched +
# idempotent + bounded (CURATE_MAX_BATCHES) so each run stays reviewable.
# GEMINI_API_KEY is injected into the runner env only — never logged.

on:
  workflow_dispatch:
    inputs:
      sample:
        description: 'Dry-run sample size (0 = real run; >0 = print first N candidates, no API call, no write)'
        required: false
        default: '0'
      region:
        description: 'Restrict to one cuisine slug prefix (e.g. singaporean, japanese). Empty = all regions.'
        required: false
        default: ''
      batch_size:
        description: 'Dishes per Gemini call'
        required: false
        default: '6'
      max_batches:
        description: 'Max batches this run (keeps the review PR small)'
        required: false
        default: '8'

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Seed overlay from prior batches (if any)
        run: |
          set -e
          PATHS="nation-overlay-dishnotes.generated.js"
          # main never merges bot/curate-dish-sources between dispatches, so
          # if we curated against main's checkout as-is, buildWorkList would
          # reselect the SAME already-fixed candidates every single dispatch
          # (its todo list is derived fresh from whatever's on disk, and
          # main's copy never changes) — the batch loop would never advance.
          # Seed the file with the bot branch's ACCUMULATED state first, so
          # the classifier sees prior fixes as ok-tier1/2/wiki and picks
          # genuinely new candidates this run.
          if git ls-remote --exit-code --heads origin bot/curate-dish-sources >/dev/null 2>&1; then
            echo "bot/curate-dish-sources exists — seeding overlay from its accumulated state."
            git fetch origin bot/curate-dish-sources
            git show origin/bot/curate-dish-sources:"$PATHS" > "$PATHS"
          else
            echo "bot/curate-dish-sources does not exist yet — starting from main's overlay."
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Curate dish sources
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SAMPLE: ${{ github.event.inputs.sample }}
          REGION: ${{ github.event.inputs.region }}
          CURATE_BATCH_SIZE: ${{ github.event.inputs.batch_size }}
          CURATE_MAX_BATCHES: ${{ github.event.inputs.max_batches }}
        run: node scripts/curate-dish-sources.mjs
      - name: Push re-curated overlay to branch
        if: ${{ github.event.inputs.sample == '0' || github.event.inputs.sample == '' }}
        run: |
          set -e
          PATHS="nation-overlay-dishnotes.generated.js"
          if [ -z "$(git status --porcelain $PATHS)" ]; then
            echo "No change to the dish-notes overlay — nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # We never switch branches here — the overlay was already seeded
          # from the bot branch's accumulated state (or main's, on the first
          # run) before curation ran, so the working tree already reflects
          # "everything fixed so far, plus this batch's new fixes." Commit it
          # on top of the current (main) checkout and push that single
          # commit's tip onto bot/curate-dish-sources with force-with-lease —
          # every other tracked file is untouched, so the tree only differs
          # from main in this one file, same as a plain content-only commit.
          git add $PATHS
          git commit -m "chore(content): re-curate dish sources (grounded batch, region=${REGION:-all})"
          git push --force-with-lease origin HEAD:refs/heads/bot/curate-dish-sources
          echo "Updated bot/curate-dish-sources with this batch's accumulated fixes."
        env:
          REGION: ${{ github.event.inputs.region }}
