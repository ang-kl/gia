# Soleat deploy config — emits the bundled single-page Vibe Journal
# directly into `public/doc/` so the existing Express route at
# `/doc/vibe-journal.html` (index.js:7780-7797, VIBE_JOURNAL_KEY-gated)
# serves the new 5-row tabbed framework without any route changes.
#
# Run from the repo root:
#   cd .vibe-journal
#   node bin/vibe-journal.mjs regen --config examples/soleat-deploy/config.yaml
# Re-run whenever doc/ or vault/ updates land on main.
project:
  name: Soleat
  repo: ang-kl/gia
  doc_root: ../../../doc/
  vault_root: ../../../vault/
  repo_root: ../../../

# Bundled mode — render.mjs emits ONE HTML + ONE JSON instead of the
# multi-file dist/. The HTML inlines CSS + JS and fetches the JSON
# blob, matching the Express whitelist `VIBE_DOC_FILES`.
bundled_html: ../../../public/doc/vibe-journal.html
bundled_json: ../../../public/doc/vibe-journal.json
bundled_json_url: vibe-journal.json     # relative URL the HTML fetches

sources:
  pr:
    enabled: true
    github_repo: ang-kl/gia
  register:    { glob: ../../../doc/Register/register-*.md }
  third_party:
    sources:
      - { type: yaml, path: ../../../doc/third-party.yaml }
      - { type: github-issues, repo: ang-kl/gia, state: all }
  technical:   { glob: ../../../doc/Technical/technical-*.md }
  feature:     { glob: ../../../doc/Feature/feature-*.md }
  legal:       { glob: ../../../doc/Legal/legal-*.md }
  vault:       { glob: ../../../vault/*/VAULT_README.md }
  journal:     { glob: ../../../doc/Journal/journal-*.md, hdr_format: "[HDR]" }
  builder:     { glob: ../../../doc/Builder/builder-*.md }
  persona:     { glob: ../../../doc/Persona/persona-*.md }
