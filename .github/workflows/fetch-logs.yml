name: Auto Fetch Railway Logs

# Operator (12-06 '26): collect prod logs hourly into log/ (JSON) so a
# "location drift" report from ANY ChatID can be reconstructed (pairs with the
# default-on [LocDrift] telemetry in index.js). Uses the Railway public GraphQL
# API (backboard) with secrets.RAILWAY_API_KEY.
#
# NOTE: scheduled workflows only run from the DEFAULT branch (main), so this is
# inert on PR branches until merged.

on:
  schedule:
    - cron: '0 * * * *'        # hourly, top of the hour (UTC)
  workflow_dispatch:           # manual run from the Actions tab (use this to test)

permissions:
  contents: write              # the job commits the fetched log file back to main

concurrency:
  group: fetch-logs            # never let two fetches race the push
  cancel-in-progress: false

env:
  RAILWAY_API: https://backboard.railway.com/graphql/v2
  PROJECT_ID: 5fc70f51-c629-4d1b-861c-56ad81071d20
  ENVIRONMENT_ID: cdfa2ad0-259b-4631-9dda-cd761d45e5ae
  # Cuisine/Express app service (emits [Cuisine-Search] / [set-location] /
  # [LocDrift]). Swap for another serviceId to capture a different service.
  SERVICE_ID: f9a39516-757d-4698-a32e-dc9de7b6e5a0
  WINDOW_MIN: 65               # minutes back to fetch (slight overlap absorbs cron jitter)

jobs:
  fetch-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Calculate time window
        id: time
        run: |
          UNTIL_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          SINCE_TIME=$(date -u -d "${WINDOW_MIN} minutes ago" +"%Y-%m-%dT%H:%M:%SZ")
          STAMP=$(date -u +"%Y-%m-%dT%H-%M-%SZ")   # colon-free for the filename
          {
            echo "since=$SINCE_TIME"
            echo "until=$UNTIL_TIME"
            echo "file=log/log-${STAMP}.json"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch logs from Railway
        id: fetch
        env:
          RAILWAY_API_KEY: ${{ secrets.RAILWAY_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_API_KEY:-}" ]; then
            echo "RAILWAY_API_KEY not set — skipping (add it in repo Settings → Secrets)."
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p log
          SINCE="${{ steps.time.outputs.since }}"
          UNTIL="${{ steps.time.outputs.until }}"
          FILE="${{ steps.time.outputs.file }}"

          # 1) Resolve the service's latest 5 deployments. deploymentLogs is
          #    scoped to ONE deployment, and a fresh redeploy (e.g. just after a
          #    merge) has NO logs in a 65-min-back window — those belong to the
          #    PREVIOUS deployment. So we fetch the last few and merge, which
          #    covers the window across any recent redeploy.
          DEP_BODY=$(jq -n --arg pid "$PROJECT_ID" --arg eid "$ENVIRONMENT_ID" --arg sid "$SERVICE_ID" \
            '{query:"query($input: DeploymentListInput!){deployments(first:5,input:$input){edges{node{id createdAt}}}}",
              variables:{input:{projectId:$pid,environmentId:$eid,serviceId:$sid}}}')
          DEP_RESP=$(curl -sS --max-time 60 -X POST "$RAILWAY_API" \
            -H "Authorization: Bearer $RAILWAY_API_KEY" -H "Content-Type: application/json" \
            --data "$DEP_BODY")
          DIDS=$(echo "$DEP_RESP" | jq -r '.data.deployments.edges[].node.id // empty')
          if [ -z "$DIDS" ]; then
            echo "Could not resolve any deployment. API said:"; echo "$DEP_RESP"
            exit 1
          fi

          # 2) Fetch each deployment's logs in the window; accumulate the rows.
          echo '[]' > /tmp/all.json
          for DID in $DIDS; do
            LOG_BODY=$(jq -n --arg did "$DID" --arg s "$SINCE" --arg e "$UNTIL" \
              '{query:"query($d:String!,$s:DateTime,$e:DateTime){deploymentLogs(deploymentId:$d,startDate:$s,endDate:$e,limit:5000){timestamp message severity tags{deploymentId serviceId}}}",
                variables:{d:$did,s:$s,e:$e}}')
            R=$(curl -sS --max-time 90 -X POST "$RAILWAY_API" \
              -H "Authorization: Bearer $RAILWAY_API_KEY" -H "Content-Type: application/json" \
              --data "$LOG_BODY")
            echo "$R" | jq -c '.data.deploymentLogs // []' > /tmp/one.json 2>/dev/null || echo '[]' > /tmp/one.json
            N=$(jq 'length' /tmp/one.json)
            echo "  deployment $DID → $N rows"
            jq -s '.[0] + .[1]' /tmp/all.json /tmp/one.json > /tmp/merged.json && mv /tmp/merged.json /tmp/all.json
          done

          # 3) Sort by timestamp, wrap with the window, write the file.
          jq --arg s "$SINCE" --arg e "$UNTIL" \
            '{since:$s, until:$e, count:length, logs:sort_by(.timestamp)}' /tmp/all.json > "$FILE"
          ROWS=$(jq -r '.count // 0' "$FILE")
          echo "Fetched $ROWS log rows (merged across deployments) into $FILE"
          echo "rows=$ROWS" >> "$GITHUB_OUTPUT"

      - name: Commit and push logs
        if: steps.fetch.outputs.skip != '1' && steps.fetch.outputs.rows != '0'
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          # Push the log file to log/ on main (operator's choice). main is a
          # PROTECTED branch with 4 required status checks, so for this raw bot
          # push to succeed the `github-actions[bot]` actor MUST be on the branch
          # ruleset's bypass list (Settings → Rules/Branches → allow Actions to
          # bypass required checks). Without that, the push is rejected (GH006).
          git add "${{ steps.time.outputs.file }}"
          git commit -m "logs: ${{ steps.time.outputs.since }} → ${{ steps.time.outputs.until }} (service ${SERVICE_ID})"
          git pull --rebase --autostash origin main
          git push origin main
