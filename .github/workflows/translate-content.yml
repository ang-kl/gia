name: Translate curated prose (Gemini)

# Manual-only. Generates id/ru/de translations of nation-overlay
# touristExplainer prose via the Gemini API, then opens a PR with the
# generated overlay for human review. NEVER auto-merges; NEVER touches
# hand-authored source. The GEMINI_API_KEY repo secret is injected into
# the runner env only — it is never written to the repo or the logs.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you regenerating translations? (logged in the PR body)'
        required: false
        default: 'Refresh curated-prose translations'

permissions:
  contents: write
  pull-requests: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Generate translations
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/translate-content.mjs

      - name: Open PR with generated overlay
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/translate-content
          delete-branch: true
          commit-message: 'chore(i18n): regenerate curated-prose translations (id/ru/de)'
          title: 'i18n: curated-prose translations (id/ru/de) — Gemini'
          body: |
            Auto-generated by the **Translate curated prose** workflow.

            **Reason:** ${{ github.event.inputs.reason }}

            - Source: `nation-overlay.js` `touristExplainer.en`
            - Output: `nation-overlay-i18n.generated.js` (id/ru/de overlay, merged at load)
            - Proper nouns (dish/cuisine/place names, native terms) preserved verbatim.

            ⚠️ **Review before merge** — Gemini drafts are not auto-trusted. Run the
            ru/de linguistic-review agent + a pill-fit / factual-fidelity pass.
          add-paths: |
            nation-overlay-i18n.generated.js
