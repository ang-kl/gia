<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Gia Map</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    html, body { height: 100%; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #map { height: 100%; width: 100%; }
    #status {
      position: fixed; left: 12px; right: 12px; top: 12px;
      background: rgba(255,255,255,0.92); border-radius: 12px; padding: 10px 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15); font-size: 14px; line-height: 1.4;
      pointer-events: none; transition: opacity 0.25s;
    }
    #status.hidden { opacity: 0; }
  </style>
</head>
<body>
  <div id="status">Loading sanctuary picks…</div>
  <div id="map"></div>
  <script src="/static/app.js"></script>
</body>
</html>
