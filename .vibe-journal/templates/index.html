<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vibe Journal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="vj-topbar">
    <button class="vj-hamburger" type="button" aria-label="Toggle navigation" aria-expanded="false" aria-controls="vj-sidebar">
      <span aria-hidden="true">☰</span>
    </button>
    <div class="vj-topbar-text">
      <h1 class="vj-title">Vibe Journal</h1>
      <div class="vj-meta">
        <span id="vj-project"></span>
        <span class="vj-meta-sep">·</span>
        <span id="vj-generated"></span>
      </div>
    </div>
  </header>

  <div class="vj-shell">
    <div class="vj-backdrop" hidden></div>

    <aside class="vj-sidebar" aria-label="Sections" id="vj-sidebar">
      <nav class="vj-nav" id="vj-nav"></nav>
      <div class="vj-sidebar-footer">
        Generated by <a href="https://github.com/" target="_blank" rel="noopener">vibe-journal</a>
      </div>
    </aside>

    <main id="vj-panel" class="vj-panel" aria-live="polite">
      <p class="vj-loading">Loading…</p>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
