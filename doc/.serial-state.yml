e name:'') -> return WITHOUT following. Explicit pick wins until the user clears/changes it. Race-safe in practice: tryServerCache (fast loc-table fetch) resolves before the sync's fresh-GPS tick (maximumAge:0, timeout 3.5s). Net: Menu pick Tokyo -> Cuisine anchors + loads Tokyo, not SG. cuisine build green; full suite 106/3007 green. NOT live-E2E tested. Anchor 17:15 -> 17:45 SGT 07-06; commit/journal/build 583/570/368 -> 584/571/369. Version 0.61.370 -> 0.61.371.) (operator chose '1' = reconcile region from coords so the SG-only tiles re-enable. Follows v0.61.369 (flag from coords): the SG-tile gating (web/menu/src/App.jsx isMy + regionUnresolved) also trusted the STALE stored region=OTHER on a Bukit Merah/SG anchor, greying Hawker/Train/Incidents/Bus stops/Weather. FIX: new anchorInSG = (coordsToCountry(anchor)==='SG'); isMy now `anchor && !anchorInSG && (region JB|MY-PUT|OTHER)`; regionUnresolved now `anchorLoading || (anchor && !anchor.region && !anchorInSG)`. So a coords-in-SG anchor re-enables the SG tiles regardless of a stale stored region. STATELESS/display-only: isMy+regionUnresolved are used ONLY for the tile + TrainPanel disable styling (lines 698/699/726) - NO search/persistence/state change (deliberately avoided a reactive region-reconciliation effect after today's gate-timer churn lessons). menu build green; full suite 106/3007 green. NOT live-E2E tested. Anchor 16:45 -> 17:15 SGT 07-06; commit/journal/build 582/569/367 -> 583/570/368. Version 0.61.369 -> 0.61.370.) (operator [Image 7]: "is the menu TMA behave the same as Cuisine TMA, it shows bukit merah with vn flag". The Menu compact-pill flag trusted currentAnchor.region then currentAnchor.country||countryPref - all STALE (VN/OTHER leftover from the prior Hanoi session) while the anchor coords were Bukit Merah = Singapore. FIX (web/menu/src/components/LocationFieldMenu.jsx compact pill): derive the flag from the anchor COORDS (ground truth) - coordsToCountry(anchor) SG->SG flag, MY+isJbCoords->Jo