# v0.61.140 (commit 353 / journal 341 / build 143) — Wake-from-idle
# 2-step rewrite: request_location first → reverse-geocode street →
# rich comparison message with cached anchor + 3 inline buttons + /l
# helper text. PR #641 (branch claude/v0.61.140-wake-rewrite, off
# main at v0.61.139 / aba2225). Operator (from the screenshot triplet
# alongside PR A branding + PR B Menu anchor format): rewrite the
# wake-from-idle prompt to compare device-near vs saved-anchor and
# offer 3 paths instead of just keep/new.
# Flow:
#   1. promptLocationOnWake stamps wake:pending:<chat> (10-min TTL)
#      and sends a brief intro + LOCATION_REQUEST_KEYBOARD (request_
#      location reply-keyboard, one_time_keyboard:true).
#   2. The user shares device GPS. bot.on('location') sees the
#      wake:pending flag, deletes it, and routes to
#      handleWakeLocationResponse — does NOT overwrite the cached
#      anchor.
#   3. handleWakeLocationResponse reverse-geocodes the device GPS to
#      a street name (operator spec: street only, not full address),
#      reads the cached anchor (v0.61.139 street/building/postal
#      composite or curated label fallback), and sends the rich
#      `wake2.body` HTML message with 3 inline buttons + /l helper
#      text. The new device GPS is stashed in wake2:offer:<chat>
#      (10-min TTL) for the wake2:current button.
#   4. Callbacks: wake2:current applies the device GPS via
#      setUserLocation; wake2:keep is a no-op ack; wake2:another
#      sends a /l-usage hint + the request_location reply keyboard.
# Files: index.js (+1 promptLocationOnWake rewrite, +1 new
# handleWakeLocationResponse helper, +1 wake-pending branch at the
# top of bot.on('location'), +3 callback handlers, +1 tn import
# in the callback handler scope), i18n.js (+1 wake.intro + 8 new
# wake2.* keys, EN + FR each, 18 string pairs total). Back-compat:
# the old wake.locationCheck / wake.keepBtn / wake.newBtn / wake.kept
# strings + the wake:keep / wake:new callback handlers all remain
# in place so users with old wake messages in chat history can still
# tap them without errors. package.json 0.61.139 -> 0.61.140.
