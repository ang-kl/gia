# v0.61.222 (commit 435 / journal 423 / build 225) — two
# operator-reported OTHER picker bugs from a KR session:
#
# **Bug A — KR + Japanese cuisine returned only 4 venues.**
# Root cause: `filterVenuesByCountry` (country-text-match.js)
# applied an all-Latin keyword set to venues whose
# `area + name` was Hangul (Places returned legitimate Tokyo /
# Seoul restaurants with Hangul or Kanji display names). The
# substring match `'seoul'.includes(hangul)` is always false →
# the filter dropped ~80% of valid venues.
#
# Fix: detect non-Latin-script characters in `area + name`
# (Hangul / Hiragana / Katakana / CJK / Thai / Lao / Khmer /
# Burmese / Cyrillic blocks) and fail-open for those venues.
# locationBias.circle remains the primary geographic constraint;
# the keyword filter still drops cross-border Latin-script venues
# (regression guard test ensures SG-in-MY drop still works).
#
# **Bug B — KR + "LG" picker returned ONE result labelled "null".**
# Root cause: index.js:11923 (place-search-by-country Places path)
# was missing the `|| 'Unnamed'` fallback the Geocoding path at
# line 11966 has. When Places returned a result whose
# `displayName.text` was empty/missing, `smartPlaceLabel(null, '')`
# returned null → JSON shipped `primaryText: null` → JSX rendered
# the literal string "null".
#
# Fix: chain fallbacks at line 11923 —
#     smartPlaceLabel(...) || formattedAddress || query || 'Unnamed'
#
# Verification: direct Node smoke (4/4 cases ✓), node --check on
# both files OK. Vitest hit the same iCloud ENV err as v0.61.219;
# CI will validate.



