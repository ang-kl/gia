# hard cap), running the same per-seed discover + venueFilter +
# sm.filterByMode at each step, deduping against the venues already
# accumulated. Stops as soon as count >= 8 or the cap is hit.
# Surfaced as payload.specialModeWidened + .specialModeWidenedFromM
# + .specialModeFinalRadiusM. searchRadius itself is not mutated so
# downstream cache + dedup-slice keep the original-request radius.
