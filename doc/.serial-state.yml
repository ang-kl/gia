# New helpers in mapOverlays.js: clusterLabelNode, footprintOverlap,
# applyClusterAndDrop. Carpark + Attractions split out of the marker
# branch in applyVisibility into an early-return that calls
# applyClusterAndDrop. Cluster pool lives on e._clusters, reused
# across renders. Cluster pill click zooms in 2 levels capped at z18.
# public/app.js mirrors with runClusterPass — buckets visible items
# into a 40 px tile, applies the same per-tile cluster/individual
