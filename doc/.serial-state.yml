# v0.61.120 (commit 333 / journal 321 / build 123) — Chat free-text
# whitelist for "<cuisine> + <food noun>" queries. PR #619 (branch
# claude/v0.61.118-cuisine-browse-whitelist before rebase, squash-
# merged as 60b3e40 off main at v0.61.119 / d2abe1e). Operator
# reported "western cuisine nearby" returned the food-nudge decline
# ("🍛 Please try a dish name…") instead of running a Places search.
# Root cause: v0.60.216 food-relatedness gate (Gemini classifySearch
# Intent) buckets "<cuisine> + <food noun>" patterns as 'ambiguous'
# because the prompt only knows dish/ingredient/tool/venue. New helper
# looksLikeCuisineBrowse(text) in freetext-classify.js returns true iff
# the text contains BOTH a cuisine word (via cuisine-family.cuisineFamily
# OR an umbrella from CUISINE_UMBRELLA_WORDS like western/asian/fusion/
# continental/international/pan asian/eclectic/global) AND a food-
# specific noun (cuisine/food/restaurant/eatery/dining/dish/menu/
# kopitiam/hawker/foodcourt/nearby/near/around + plurals). On hit the
# Gemini classifier is skipped entirely; on miss the existing v0.60.216
# protection fires. Wired into index.js chat free-text gate ~7738.
# Bare cuisine words ("italian") and bare food nouns ("restaurant")
# still go through the gate by design. New 7-spec describe block in
# __tests__/freetext-classify.test.js. Full vitest suite eventually
# ran on Node 24 + iCloud after a ~3-hour cold-read penalty and passed
# 1951/1951 (incl. new 15-test freetext-classify.test.js). Reduces
# Gemini-Flash calls (whitelist short-circuits the classifier).
