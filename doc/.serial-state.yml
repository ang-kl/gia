# v0.61.194 (commit 407 / journal 395 / build 197) — Catmull-Rom
# spline smoothing for LRT lines (BPL/SLRT/PLRT). Operator
# screenshots showed the existing Chaikin 2-iter smoothing
# pulled the polylines ~25% inward from each control point,
# which is invisible on MRT (1-2 km spacing) but visibly offset
# the LRT polylines from station markers (200-500 m spacing).
# Operator also flagged BPL's lollipop topology being distorted
# into a single oval. Operator: "the lines ought to have curve?"
#
# Catmull-Rom is an INTERPOLATING spline (vs Chaikin's
# approximation): the curve is GUARANTEED to pass through every
# control point. Stations stay ON the line, curve is smooth
# between them. 12 sub-samples per control-point pair.
#
# MRT lines keep Chaikin (well-tested, fine at MRT spacing).
#
# Branch claude/v0.61.194-catmull-rom-lrt off main at v0.61.193.
# Files (3):
# - web/transport/src/data/line-paths.js:
#   * NEW _catmullRomBlend(p0, p1, p2, p3, t) — uniform Catmull-Rom
#     blend function (standard cubic formula, t=0 returns p1,
#     t=1 returns p2).
#   * NEW catmullRomSegment(seg, samples=12) — interpolates a
#     dense polyline through the input control points. Closed
#     loops (first === last) wrap around for proper tangents at
#     the join; open paths duplicate first/last as degenerate
#     tangents. Returns input unchanged for < 2 points. Rounds
#     to 6 decimals.
#   * NEW CATMULL_ROM_LINES = Set('BPL', 'SLRT', 'PLRT'). The
#     smoothLinePaths dispatcher routes these through
#     catmullRomSegment(seg, 12); all others stay on
#     smoothSegment(seg, 2) (Chaikin).
