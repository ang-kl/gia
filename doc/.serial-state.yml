# v0.61.212 (commit 425 / journal 413 / build 215) — test
# scaffolding for the place-search-by-country endpoint. Operator
# (28-05 '26): "do a test of 300 test each of how different
# people use the google map search in their native language or
# tourist from singapore or english or french use, through out
# in different cities of Malaysia, Japan, Korea, Indoneasia,
# thailand". Refined to 1700 tests (340 curated venues × 5
# typing variants) per operator's revised country breakdown:
# MY 100 (5 cities × 20), JP 60 (2 × 30), KR 60 (2 × 30), ID 60
# (2 × 30), TH 60 (3 × 20).
#
# Five typing variants per venue:
#   1. full         — canonical name as a local types it
#   2. shortened    — tourist-shortened (Berjaya Times Square → Times Square)
#   3. native       — native-script for JP/KR/TH (東京駅, 강남역, สยามพารากอน)
#                     or `<name> <Country>` for MY/ID (Latin only)
#   4. typo         — deterministic typoize() drops a vowel /
#                     swaps consonants (Pavilion → Pavlion)
#   5. descriptive  — vague / "near me" / language-mixed
#                     ("shopping mall Kuala Lumpur",
#                      "train station Tokyo")
#
# Output: per row, runner records places=N geocode=N merged=N,
# top-1 hit, top-6 hit (using fuzzy name-token overlap ≥ 50%),
# top-1's rating + userRatingCount + source. Aggregate summary
# by variant / country / city.
#
# Bar for "good place" per operator's 2026-05-28 spec: top-1 is
# the intended landmark. Rating + userRatingCount are reported
# but not gating (the cuisine-search downstream applies the
# rating ≥ 4.0 + MIN_TOP_RATED = 3 criteria from
# cuisine-nearby-widen.js).
#
# Cost: ~$85 in API spend (~$0.05/test row at 1700 rows). Runner
# supports --limit (smoke test) and --country (single-country
# deep dive) flags to cap spend during iteration.
#
# This PR ships ONLY the scaffolding. Operator runs `node
# scripts/place-search-variance/run.mjs` themselves with their
# GOOGLE_MAPS_API_KEY in env. Output (results-<stamp>.json) is
# gitignored. Findings + tuning recommendations land in a
# follow-up PR (v0.61.213+).
