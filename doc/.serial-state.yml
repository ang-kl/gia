x several + LocationFieldMenu country-pref GET header/POST + set-location) each carry deviceId. Bot-chat (no device) unchanged = chatId-level. Failure mode degrades to today's behaviour (fallback). 6 new unit tests (location-cache + country-pref device isolation + seed fallback + chatId-level refresh); menu+cuisine builds green; full suite 106/3007 green. NOT live-E2E tested. Anchor 13:00 -> 13:45 SGT 07-06; commit/journal/build 575/562/360 -> 576/563/361. Version 0.61.362 -> 0.61.363.) (operator: "i thought the 20 seconds codes will detect the location and the flag. i load menu.tma" -> chose option 1 (global flag in the 20s sync, mirror into Cuisine). ROOT CAUSE: the 20s startLocationSync resolved the country with coordsToCountry() = a SG/MY-only bounding-box; outside SG/MY it returned null so the flag kept the stale cached country. The richer global detector (nearestIataCity / iata-snap) ran ONCE on mount, not during the follow. FIX: MENU web/menu/src/App.jsx sync onLocation now SG/MY via bbox else nearestIataCity(loc).city.countryCode filtered to MENU_FLAG_COUNTRIES (= OTHER_COUNTRIES codes), region=SG/JB/OTHER, persists set-location + (non-SG) country-pref; mount auto-detect setAnchor now also carries country:detected.countryCode; LocationFieldMenu compact-pill flag now findCountry(currentAnchor.country || countryPref) so the live anchor country drives the flag (countryPref is seeded once on mount, so it alone never followed). CUISINE web/cuisine/src/v2/App.jsx sync mirrors: outside SG/MY -> nearestIataCity -> CUISINE_OTHER_CODES -> setState region OTHER + countryPref cc + saveCountryPref (cuisine collapsed pill shows no OTHER flag, so this fixes region/picker follow). Unsupported countries keep the prior flag (Menu can't render them). menu+cuisine builds green; full suite 106/3001 green. NOT live-E2E tested (no Telegram WebView / GPS). Preconditions still apply: location permission granted + a >1.5km move. Anchor 12:15 -> 13:00 SGT 07-06; commit/journal/build 574/561/359 -> 575/562/360. Version 0.61.361 -> 0.61.362.) (operator 'PR' -> build PR 2 of the FX feature = Option B device currency. The converted venue price now targets the user's DEVICE HOME currency (the phone's locale region), not the location-based country. CLIENT: web/cuisine/src/v2/lib/api.js postJson injects deviceRegion on every request, derived ONCE from navigator.language via new Intl.Locale(lang).maximize().region (fallback: the explicit region substring, e.g. en-GB -> GB). SERVER: currency-format.js COUNTRY_TO_CURRENCY expanded from ~30 to ~170 ISO-3166->ISO-4217 entries (covers MO/BN/KH/LA/MM the old ECB map omitted + the global long tail) + a dozen extra CURRENCY_PREFIX symbols (MOP$/B$/R$/RUB/TRY/ILS/AED/SAR/ZAR/MXN/NGN); MO/BN added to COUNTRY_PREFIX. enrichPriceRangeDisplay(chatId,venues,deviceCountry) now prefers a valid deviceCountry (^[A-Z]{2}$) and only falls back to resolveUserCountry(chatId) when absent (bot-chat flows, or an older TMA build). Wired at the cuisine /api/cuisine/search enrich site (deviceRegion parsed beside countryCode) + inside handleMichelinSearch (michDeviceRegion from req.body). Bot-chat enrich sites (Search/Search-FanOut/Nation-Iconic/Cooking-Method, all safeSend) left on the location fallback by design. 4 new unit tests (long-tail map + GB-£ device conversion + AED CODE-prefix fallback); cuisine build green; full suite 106 files / 3001 green. NOT live-E2E tested (no Telegram WebView to confirm Intl region + no live FX). Anchor 11:45 -> 12:15 SGT 07-06; commit/journal/build 573/560/358 -> 574/561/359. Version 0.61.360 -> 0.61.361.) (operator 07-06 '26: "I added ALPHAVANTAGE_API_KEY for foreign exchange rate, as currently only in Malaysia that is rigid with fixed foreign currency exchange rate. Use real time only once … 15 days, therefore have a table for these countries in the picker and the exchange rate to local device. users can be across 170 nations." Decisions: 1=Option B device currency, 2=use USD as base, 3=lazy fetch; "markup: 2.8% across all, round up to 2 decimal places for currency that uses cents" + whole numbers for no-cents (JPY/KRW/VND/IDR) + "≈" marker. THIS PR (PR 1 of 2) = the FX ENGINE only: currency-format.js rewritten to a USD-pivot table. NEW usdRate(cur,redis) = USD per 1 unit, primary Alpha Vantage CURRENCY_EXCHANGE_RATE (process.env.ALPHAVANTAGE_API_KEY; rate-limit Information/Note envelope -> miss), fallback Frankfurter (from=cur&to=USD), 15-day cache fx:usd:<CUR> TTL 15*24*3600, USD short-circuit 1.0. fetchFxRate(a,b) rewritten = usdRate(a)/usdRate(b) -> any-to-any cross rate (fixes the TWD/VND/MOP/BND gap Frankfurter omitted = the 'rigid' cause). convAmount() applies FX_MARKUP 1.028 then Math.ceil (whole for NO_CENTS set, else 2dp); conversion prefixed '≈'. Native menu price never marked up. 6 new/rewritten unit tests; full suite 106 files / 2998 green. KEEPS the existing location-based userCountry (Option A behaviour) as a testable drop-in this PR; Option B (device-currency plumbing from the TMA via Intl region -> ~170-country map) is PR 2. Server-only (no web build -> build counter held at 358). NOT live-E2E tested (no live Alpha Vantage call here). Anchor 11:00 -> 11:45 SGT 07-06; commit/journal 572/559 -> 573/560 (build held 358). Version 0.61.359 -> 0.61.360.)
