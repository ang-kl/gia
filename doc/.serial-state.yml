# v0.61.224 (commit 437 / journal 425 / build 227) — operator
# 28-05 '26: "If I change my country to singapore and type in
# 'Geylang' and tap search, it should first move the centre of
# the google map to the location in Geylang then search."
#
# Diagnosis: server-side place-anchor detection has existed since
# v0.61.129. It pivots searchCenter to the typed place's coords,
# strips the place name from freeText, and returns a placeAnchor
# field in the search response. Client at
# web/cuisine/src/v2/App.jsx:946 then explicitly RE-anchored the
# map to the PRE-search `center` (user's original location),
# clobbering the server's pivot. Result: pins landed in Geylang
# (correct) but the map stayed on Bedok (wrong).
#
# Fix: when response carries r.placeAnchor with finite lat/lng,
# setSearchCenter to placeAnchor's coords; otherwise keep the
# pre-search center. One conditional in App.jsx.



