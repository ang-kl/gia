# lifted out of the radius-clamp try block for reuse by O-23.
# chipDisambig probe now reads ftRawIn (post-strip) so place names
# don't enter R.E.D disambig. freetext-log captures ftRawOriginal
# (pre-strip) so telemetry sees what the user actually typed.
