# v0.61.252 (commit 465 / journal 453 / build 255) — operator
# 29-05 '26 afternoon: "My location is Malaysia, Putrajaya. I
# start the Menu TMA, it jump to Kuala LUmpur. this is wrong, can
# you deconflict this?"
#
# Bug: both TMAs' v0.61.249 / v0.61.243 GPS auto-detect set the
# anchor label to the IATA canonical name (`IATA_CITIES[].name`).
# That worked for cities IATA names alone (KL → "Kuala Lumpur",
# TYO → "Tokyo"), but the IATA table treats KL metro as one entry
# (KUL at 3.14, 101.69). When the operator's GPS lands at
# Putrajaya (2.93, 101.70 — 22 km from KUL coords), nearestIataCity
# returns KUL, and the label became "Kuala Lumpur" — even though
# cities.js[MY] HAS a Putrajaya entry already (code KUL post-
# v0.61.242 audit) carrying the operator's intended name.
#
# Fix: BEFORE falling back to the IATA canonical name, scan
# cities.js[detected.countryCode] for the entry NEAREST to the
# GPS by haversine. If it's within 30 km, use that name. Otherwise
# fall through to the IATA canonical. Threshold matches the
# v0.61.243 cached-anchor drift rule.
#
# Cases:
#   Putrajaya GPS → cities.js[MY] nearest = Putrajaya (0 km)
#     → label = "Putrajaya"  (was: "Kuala Lumpur")
#   Shah Alam GPS → nearest = Shah Alam (0 km)
#     → label = "Shah Alam"  (was: "Kuala Lumpur")
#   Sibu GPS → nearest = Kuching (~150 km, >30 km)
#     → label = "Sibu" (IATA canonical SBW from iata-cities.js,
#     unchanged from v0.61.249)
#
# - web/cuisine/src/v2/App.jsx autoDetect — adds 30 km scan, falls
#   back to IATA canonical when no curated match. Imports
#   CITIES_BY_COUNTRY from ./lib/cities.js.
# - web/menu/src/App.jsx runAutoDetect — same fix, imports
#   CITIES_BY_COUNTRY from ./cities.js.



