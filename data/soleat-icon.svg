<?xml version="1.0" encoding="UTF-8"?>
<!--
  soleat icon — v0.57.4
  Per Human Lead: "map of singapore in background, rice on top of small
  banana leaf (a play of rice universal in asian, malay banana common
  to us), and a steak knife next [to] banana leaf".

  Hand-authored SVG; replace with a designer-made version when ready.
  Viewbox 512×512 (square; clips fine to circular masks).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="soleat icon">
  <!-- Sky / island background gradient -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%"  stop-color="#FEF6E4"/>
      <stop offset="100%" stop-color="#F5D8A0"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#3FAE3F"/>
      <stop offset="60%"  stop-color="#2E8B2E"/>
      <stop offset="100%" stop-color="#0F5B0F"/>
    </linearGradient>
    <radialGradient id="rice" cx="50%" cy="40%" r="60%">
      <stop offset="0%"  stop-color="#FFFFFF"/>
      <stop offset="80%" stop-color="#F5F2EA"/>
      <stop offset="100%" stop-color="#E2DCCB"/>
    </radialGradient>
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#E8EAEC"/>
      <stop offset="50%"  stop-color="#B8BCC2"/>
      <stop offset="100%" stop-color="#7B8088"/>
    </linearGradient>
    <linearGradient id="handle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#5B3A1F"/>
      <stop offset="100%" stop-color="#2E1B0E"/>
    </linearGradient>
  </defs>

  <!-- Round backdrop -->
  <circle cx="256" cy="256" r="248" fill="url(#bg)" stroke="#D9B872" stroke-width="4"/>

  <!--
    Singapore island silhouette — simplified outline, west to east.
    Centred; fills ~75% width. Polygon is hand-drawn; not geographic-
    accurate but recognisable as Singapore's diamond-ish profile.
  -->
  <g opacity="0.30">
    <path d="M 80 280
             Q 90 260, 120 250
             Q 150 240, 180 240
             Q 220 235, 260 232
             Q 300 230, 340 235
             Q 380 240, 410 250
             Q 430 260, 432 280
             Q 425 295, 400 305
             Q 370 312, 340 312
             Q 300 314, 260 312
             Q 220 312, 180 310
             Q 140 305, 110 298
             Q 88 292, 80 280 Z"
          fill="#7DA86A" stroke="#3E5C32" stroke-width="2.5"/>
    <!-- Small offshore islands -->
    <ellipse cx="445" cy="318" rx="14" ry="6" fill="#7DA86A" stroke="#3E5C32" stroke-width="1.5"/>
    <ellipse cx="68"  cy="298" rx="10" ry="4" fill="#7DA86A" stroke="#3E5C32" stroke-width="1.5"/>
  </g>

  <!--
    Banana leaf — elongated oval with a vertical midrib and lateral veins.
    Tilted ~12° for visual rhythm.
  -->
  <g transform="rotate(-12 256 280)">
    <ellipse cx="256" cy="280" rx="170" ry="64" fill="url(#leaf)" stroke="#0E4A0E" stroke-width="3"/>
    <!-- Midrib -->
    <line x1="100" y1="280" x2="412" y2="280" stroke="#0E4A0E" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Lateral veins -->
    <g stroke="#1F6A1F" stroke-width="1.4" fill="none" opacity="0.8">
      <path d="M 130 280 Q 150 248, 200 248"/>
      <path d="M 130 280 Q 150 312, 200 312"/>
      <path d="M 180 280 Q 200 245, 250 245"/>
      <path d="M 180 280 Q 200 315, 250 315"/>
      <path d="M 230 280 Q 250 244, 300 244"/>
      <path d="M 230 280 Q 250 316, 300 316"/>
      <path d="M 280 280 Q 300 245, 350 245"/>
      <path d="M 280 280 Q 300 315, 350 315"/>
      <path d="M 330 280 Q 350 250, 390 252"/>
      <path d="M 330 280 Q 350 310, 390 308"/>
    </g>
  </g>

  <!--
    Rice mound — fluffy white dome on top of the leaf. Built from a
    central hemisphere plus surrounding "grain" highlights for texture.
  -->
  <g transform="translate(0, -8)">
    <!-- Main rice dome -->
    <ellipse cx="246" cy="262" rx="80" ry="42" fill="url(#rice)" stroke="#C9B98E" stroke-width="2"/>
    <!-- Rice grain highlights — small ellipses scattered on the surface -->
    <g fill="#FFFFFF" opacity="0.85">
      <ellipse cx="218" cy="248" rx="6" ry="3" transform="rotate(-30 218 248)"/>
      <ellipse cx="240" cy="240" rx="6" ry="3" transform="rotate(15 240 240)"/>
      <ellipse cx="262" cy="244" rx="6" ry="3" transform="rotate(-12 262 244)"/>
      <ellipse cx="282" cy="252" rx="6" ry="3" transform="rotate(28 282 252)"/>
      <ellipse cx="302" cy="262" rx="6" ry="3" transform="rotate(-18 302 262)"/>
      <ellipse cx="226" cy="266" rx="6" ry="3" transform="rotate(38 226 266)"/>
      <ellipse cx="248" cy="270" rx="6" ry="3" transform="rotate(-8 248 270)"/>
      <ellipse cx="272" cy="274" rx="6" ry="3" transform="rotate(20 272 274)"/>
      <ellipse cx="200" cy="262" rx="5" ry="2.5" transform="rotate(-45 200 262)"/>
      <ellipse cx="294" cy="278" rx="5" ry="2.5" transform="rotate(35 294 278)"/>
    </g>
    <!-- Soft top highlight -->
    <ellipse cx="240" cy="238" rx="40" ry="9" fill="#FFFFFF" opacity="0.5"/>
  </g>

  <!--
    Steak knife — to the right of the banana leaf, blade angled
    pointing up-right, serrated edge along the bottom.
  -->
  <g transform="translate(346, 230) rotate(28)">
    <!-- Blade (gradient) -->
    <path d="M 0 0
             L 130 -6
             L 142 0
             L 130 6
             L 0 8 Z"
          fill="url(#blade)" stroke="#5B6068" stroke-width="1.4"/>
    <!-- Bolster (rivet area between blade and handle) -->
    <rect x="-12" y="-3" width="14" height="14" fill="#9DA3AB" stroke="#3F4248" stroke-width="1"/>
    <!-- Handle (wood) -->
    <path d="M -68 -3 L -12 -3 L -12 11 L -68 11
             Q -78 11, -78 4 Q -78 -3, -68 -3 Z"
          fill="url(#handle)" stroke="#1A0E06" stroke-width="1.5"/>
    <!-- Two rivets on handle -->
    <circle cx="-30" cy="4" r="2" fill="#C9C2B6"/>
    <circle cx="-55" cy="4" r="2" fill="#C9C2B6"/>
    <!-- Serrations along bottom edge of blade -->
    <g stroke="#5B6068" stroke-width="0.9" fill="none">
      <path d="M 6 8 l 3 4 l 3 -4 M 18 8 l 3 4 l 3 -4 M 30 8 l 3 4 l 3 -4
               M 42 8 l 3 4 l 3 -4 M 54 8 l 3 4 l 3 -4 M 66 8 l 3 4 l 3 -4
               M 78 8 l 3 4 l 3 -4 M 90 8 l 3 4 l 3 -4 M 102 8 l 3 4 l 3 -4
               M 114 8 l 3 4 l 3 -4"/>
    </g>
    <!-- Subtle blade highlight along top -->
    <line x1="2" y1="-3" x2="135" y2="-5" stroke="#FFFFFF" stroke-width="1.2" opacity="0.7"/>
  </g>

  <!-- Wordmark (optional, removable) -->
  <g font-family="-apple-system, system-ui, Helvetica, sans-serif" font-weight="800" text-anchor="middle">
    <text x="256" y="430" font-size="48" fill="#3E2A14" letter-spacing="2">soleat</text>
    <text x="256" y="458" font-size="14" fill="#7B5A2E" letter-spacing="3">SINGAPORE · SOLO · SANCTUARY</text>
  </g>
</svg>
